[project]
name = "nuendo-claude"
version = "0.1.0"
description = "MCP server that lets Claude control Steinberg Nuendo 13 on macOS"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2",
    "mido>=1.3",
    "python-rtmidi>=1.5",
]

[project.scripts]
nuendo-mcp = "nuendo_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nuendo_mcp"]
